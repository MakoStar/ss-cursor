<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StellaSora Cursor Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      color: #fff;
      font-family: sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.1);
      color: #fff;
      margin: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: background 0.15s;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.2); }
    .btn.active { background: rgba(120, 180, 255, 0.3); }
  </style>
</head>

<body>
  <div>
    <h1>Stella Sora Cursor</h1>
    <p style="color:#aaa;margin:1rem 0 2rem;">点击 / 长按 / 拖动鼠标查看效果</p>
    <button class="btn" onclick="switchTo('default')">Default 主题</button>
    <button class="btn" onclick="switchTo('christmas')">Christmas 主题</button>
    <button class="btn" onclick="switchTo('newyear')">New Year 主题</button>
    <button class="btn" onclick="switchTo('summer')">Summer 主题</button>
    <button class="btn" onclick="switchTo('random')">随机主题</button>
    <button class="btn" onclick="switchTo('auto')">自动(按日期)</button>
  </div>

  <script type="module">
    import { initStellaSoraCursor } from '../dist/index.esm.min.js';

    let cursor = null;

    /** 切换主题：销毁旧实例，创建新实例 */
    async function init(theme) {
      cursor?.destroy();
      cursor = await initStellaSoraCursor(
        theme === 'auto' ? {} : { theme,holdDelay:10000000000000000000000000000 }
      );

      /** 刷新按钮高亮 */
      for (const btn of document.querySelectorAll('.btn')) {
        btn.classList.toggle('active', btn.textContent.includes(
          theme === 'auto' ? '自动' :
          theme === 'random' ? '随机' :
          theme === 'newyear' ? 'New Year' :
          theme.charAt(0).toUpperCase() + theme.slice(1)
        ));
      }
    }

    window.switchTo = init;
    init('random');
  </script>
</body>

</html>
